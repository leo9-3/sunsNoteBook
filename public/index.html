<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>内网纪要本 · Intranet Notebook</title>
<link rel="stylesheet" href="/style.css"/>
</head>
<body>
<header>
  <div class="brand">🦆 内网纪要本</div>
  <input id="title" placeholder="今日纪要标题，例如：供应链备货会"/>
  <span id="saveState">已保存</span>
  <button id="delBtn" class="danger">删除本篇</button>
  <button id="exportBtn">导出 JSON</button>
</header>
<div class="layout">
  <aside>
    <button id="todayBtn" class="primary">＋ 按今天日期新建纪要</button>
    <label class="pick">选择日期新建 / 打开<input type="date" id="datePick"/></label>
    <input id="search" placeholder="搜索日期或标题…"/>
    <div id="noteList"></div>
    <p class="hint">内网版：数据保存在服务器的本地数据库 <code>data/notebook.db</code>，不连外网。无服务器打开时自动用浏览器本地存储演示。</p>
  </aside>
  <main>
    <div class="toolbar">
      <button data-add="text">＋ 文字块</button>
      <button data-add="heading">＋ 标题块</button>
      <button data-add="sticky">＋ 便签</button>
      <button data-add="todo">＋ 待办</button>
      <label class="fileBtn">＋ 图片<input type="file" id="imgInput" accept="image/*" multiple hidden/></label>
      <span class="sep"></span>
      <button id="zoomOut">－</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button>
      <button id="fitBtn">回到原点</button>
      <span class="hint">点画布任意空位直接输入 · 粘贴/拖入图片 · 拖图片或块顶栏移动 · 拉右下角缩放 · 按住空白拖动画布平移</span>
    </div>
    <div class="fmtbar">
      <span class="flabel">字体</span>
      <select id="fontSel">
        <option value="">默认（微软雅黑）</option>
        <option value="SimSun, 'Songti SC', serif">宋体</option>
        <option value="SimHei, 'Heiti SC', sans-serif">黑体</option>
        <option value="KaiTi, 'Kaiti SC', serif">楷体</option>
        <option value="FangSong, STFangsong, serif">仿宋</option>
        <option value="'DengXian', sans-serif">等线</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="Consolas, monospace">Consolas</option>
      </select>
      <span class="sep"></span>
      <button data-lv="" class="lvBtn">正文</button>
      <button data-lv="h1" class="lvBtn">标题 1</button>
      <button data-lv="h2" class="lvBtn">标题 2</button>
      <button data-lv="h3" class="lvBtn">标题 3</button>
      <span class="hint">选中文字后点样式切换（按行生效，和 Word 的标题样式一样）· 快捷键 Ctrl+Alt+0/1/2/3</span>
    </div>
    <div id="viewport"><div id="canvas"></div></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
